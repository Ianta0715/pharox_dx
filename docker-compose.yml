services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: unless-stopped
    # Aceleración por GPU NVIDIA (RTX 3080 detectada, NVIDIA Container Toolkit verificado).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-pull-model:
    image: curlimages/curl:latest
    container_name: ollama-pull-model
    entrypoint: >
      sh -c "
      echo 'Esperando que Ollama esté disponible...';
      until curl -s http://ollama:11434/api/tags > /dev/null; do
        sleep 2;
      done;
      echo 'Ollama listo. Verificando/Descargando el modelo qwen3:8b...';
      curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen3:8b\"}';
      echo 'Modelo qwen3:8b descargado con éxito.';
      echo 'Verificando/Descargando el modelo de embeddings nomic-embed-text...';
      curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"nomic-embed-text\"}';
      echo 'Modelo nomic-embed-text descargado con éxito.';
      "
    depends_on:
      - ollama

  # Neo4j local OPCIONAL.
  neo4j:
    profiles: ["local-db"]
    image: neo4j:5.18.0
    container_name: neo4j
    ports:
      - "7474:7474" # HTTP console
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/pharoxpass
      # APOC habilita apoc.meta.* / apoc.schema.* que usa Neo4jGraph (LangChain) para
      # auto-introspeccionar el esquema real; sin esto, el text-to-Cypher siempre usa
      # el fallback hardcodeado de app/graph_db.py::obtener_esquema_nativo_fallback.
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    restart: unless-stopped

  backend:
    build: .
    container_name: pharox_backend
    ports:
      - "8000:8000"
    volumes:
      - ./pharox_backend/data:/app/data
      - ./pharox_backend/app:/app/app
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen3:8b
      - NEO4J_URI=${NEO4J_URI:?Definir NEO4J_URI en .env}
      - NEO4J_USER=${NEO4J_USER:?Definir NEO4J_USER en .env}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Definir NEO4J_PASSWORD en .env}
    depends_on:
      ollama-pull-model:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ollama_storage:
  neo4j_data:
  neo4j_logs:
