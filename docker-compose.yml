services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: unless-stopped
    # Para habilitar aceleración por GPU NVIDIA si posees una en tu sistema,
    # descomenta las siguientes líneas. Asegúrate de tener instalado NVIDIA Container Toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-pull-model:
    image: curlimages/curl:latest
    container_name: ollama-pull-model
    entrypoint: >
      sh -c "
      echo 'Esperando que Ollama esté disponible...';
      until curl -s http://ollama:11434/api/tags > /dev/null; do
        sleep 2;
      done;
      echo 'Ollama listo. Verificando/Descargando el modelo qwen2.5:1.5b...';
      curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen2.5:1.5b\"}';
      echo 'Modelo qwen2.5:1.5b descargado con éxito.';
      echo 'Verificando/Descargando el modelo de embeddings nomic-embed-text...';
      curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"nomic-embed-text\"}';
      echo 'Modelo nomic-embed-text descargado con éxito.';
      "
    depends_on:
      - ollama

  neo4j:
    image: neo4j:5.18.0
    container_name: neo4j
    ports:
      - "7474:7474" # HTTP console
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/pharoxpass
    restart: unless-stopped

  backend:
    build: .
    container_name: pharox_backend
    ports:
      - "8000:8000"
    volumes:
      - ./pharox_backend/data:/app/data
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=pharoxpass
    depends_on:
      - ollama-pull-model
      - neo4j
    restart: unless-stopped

volumes:
  ollama_storage:
  neo4j_data:
  neo4j_logs:
