name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Chequeo rápido de sintaxis
        run: find pharox_backend/app -name "*.py" -print0 | xargs -0 -n1 python -m py_compile

      - name: Correr tests
        env:
          PHAROX_API_KEY: ci-test-key
          ANONYMIZATION_SALT: ci-test-salt
          CIVIC_API_KEY: ci-test-civic-key
        working-directory: pharox_backend
        run: python -m pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de la imagen Docker
        run: docker build -t pharox-backend:ci .
